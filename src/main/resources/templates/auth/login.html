<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Login – Mini Marketplace</title>
</head>
<body>
<section>
    <div style="max-width:420px; margin:0 auto; padding-top:1rem;">
        <div class="card">
            <h2 style="margin-bottom:1.5rem;">Sign In</h2>

            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password. Please try again.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out successfully.
            </div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/auth/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input class="form-control" type="text" id="username" name="username"
                           placeholder="Enter your username" required autofocus/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password"
                           placeholder="Enter your password" required/>
                </div>
                <button class="btn btn-primary" type="submit" style="width:100%; margin-top:.5rem;">
                    Login
                </button>
            </form>

            <p style="text-align:center; margin-top:1.25rem; font-size:.9rem; color:#64748b;">
                Don't have an account?
                <a th:href="@{/auth/register}" style="color:#2563eb; text-decoration:none; font-weight:500;">Register</a>
            </p>
        </div>
    </div>
</section>
</body>
</html>
