<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Register – Mini Marketplace</title>
</head>
<body>
<section>
    <div style="max-width:460px; margin:0 auto; padding-top:1rem;">
        <div class="card">
            <h2 style="margin-bottom:1.5rem;">Create Account</h2>

            <form th:action="@{/auth/register}" th:object="${userDTO}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input class="form-control" type="text" id="username" th:field="*{username}"
                           placeholder="Choose a username" autofocus/>
                    <div class="form-error" th:errors="*{username}"></div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" id="email" th:field="*{email}"
                           placeholder="you@example.com"/>
                    <div class="form-error" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="form-control" type="password" id="password" th:field="*{password}"
                           placeholder="At least 6 characters"/>
                    <div class="form-error" th:errors="*{password}"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input class="form-control" type="password" id="confirmPassword"
                           th:field="*{confirmPassword}" placeholder="Repeat password"/>
                    <div class="form-error" th:errors="*{confirmPassword}"></div>
                </div>
                <button class="btn btn-primary" type="submit" style="width:100%; margin-top:.5rem;">
                    Register
                </button>
            </form>

            <p style="text-align:center; margin-top:1.25rem; font-size:.9rem; color:#64748b;">
                Already have an account?
                <a th:href="@{/auth/login}" style="color:#2563eb; text-decoration:none; font-weight:500;">Login</a>
            </p>
        </div>
    </div>
</section>
</body>
</html>
