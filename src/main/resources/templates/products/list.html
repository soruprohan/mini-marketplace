<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Products</title></head>
<body>
<h2>Products</h2>
<a sec:authorize="hasRole('SELLER')" th:href="@{/products/new}">Add Product</a>
<div th:each="product : ${products}">
    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"></a>
    — <span th:text="${product.price}"></span>
    — <span th:text="${product.category.name}"></span>
</div>
<form th:action="@{/auth/logout}" method="post" style="margin-top:20px">
    <button type="submit">Logout</button>
</form>
</body>
</html>
