<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Product Form</title></head>
<body>
<h2 th:text="${productDTO.id != null} ? 'Edit Product' : 'New Product'"></h2>
<form th:action="${productDTO.id != null} ? @{/products/{id}/update(id=${productDTO.id})} : @{/products}"
      th:object="${productDTO}" method="post">
    <label>Name: <input type="text" th:field="*{name}"/>
        <span th:errors="*{name}" style="color:red"></span></label><br/>
    <label>Description: <textarea th:field="*{description}"></textarea></label><br/>
    <label>Price: <input type="number" step="0.01" th:field="*{price}"/>
        <span th:errors="*{price}" style="color:red"></span></label><br/>
    <label>Stock: <input type="number" th:field="*{stock}"/>
        <span th:errors="*{stock}" style="color:red"></span></label><br/>
    <label>Category:
        <select th:field="*{categoryId}">
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"></option>
        </select>
        <span th:errors="*{categoryId}" style="color:red"></span>
    </label><br/>
    <button type="submit">Save</button>
</form>
<a th:href="@{/products}">Cancel</a>
</body>
</html>
