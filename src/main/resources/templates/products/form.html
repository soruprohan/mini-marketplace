<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${productDTO.id != null ? 'Edit Product' : 'New Product'} + ' – Mini Marketplace'">Product Form</title>
</head>
<body>
<section>
    <div style="max-width:560px;">
        <h2 th:text="${productDTO.id != null ? 'Edit Product' : 'New Product'}" style="margin-bottom:1.5rem;"></h2>

        <div class="card">
            <form th:action="${productDTO.id != null} ? @{/products/{id}/update(id=${productDTO.id})} : @{/products}"
                  th:object="${productDTO}" method="post">

                <div class="form-group">
                    <label for="name">Product Name <span style="color:#dc2626;">*</span></label>
                    <input class="form-control" type="text" id="name" th:field="*{name}"
                           placeholder="e.g. Wireless Headphones"/>
                    <div class="form-error" th:errors="*{name}"></div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" th:field="*{description}"
                              rows="4" placeholder="Describe your product..."></textarea>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label for="price">Price ($) <span style="color:#dc2626;">*</span></label>
                        <input class="form-control" type="number" id="price" th:field="*{price}"
                               step="0.01" min="0.01" placeholder="0.00"/>
                        <div class="form-error" th:errors="*{price}"></div>
                    </div>
                    <div class="form-group">
                        <label for="stock">Stock <span style="color:#dc2626;">*</span></label>
                        <input class="form-control" type="number" id="stock" th:field="*{stock}"
                               min="0" placeholder="0"/>
                        <div class="form-error" th:errors="*{stock}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="categoryId">Category <span style="color:#dc2626;">*</span></label>
                    <select class="form-control" id="categoryId" th:field="*{categoryId}">
                        <option value="">-- Select a category --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"></option>
                    </select>
                    <div class="form-error" th:errors="*{categoryId}"></div>
                </div>

                <div class="flex gap-2 mt-2">
                    <button class="btn btn-primary" type="submit">
                        <span th:text="${productDTO.id != null ? 'Save Changes' : 'Create Product'}">Save</span>
                    </button>
                    <a class="btn btn-outline" th:href="@{/products}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
