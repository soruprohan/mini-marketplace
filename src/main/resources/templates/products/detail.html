<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${product.name} + ' – Mini Marketplace'">Product Detail</title>
</head>
<body>
<section>
    <div th:if="${reviewError}" class="alert alert-danger" th:text="${reviewError}"></div>

    <div style="display:grid; grid-template-columns:1fr 320px; gap:1.5rem; align-items:start;"
         class="product-layout">

        <!-- Left: product info -->
        <div>
            <div class="flex items-center" style="gap:.75rem; margin-bottom:.25rem;">
                <span class="text-muted" style="font-size:.85rem;"
                      th:text="${product.category != null ? product.category.name : 'Uncategorised'}"></span>
            </div>
            <h2 style="margin-bottom:.5rem;" th:text="${product.name}"></h2>
            <p class="text-muted" style="margin-bottom:1rem; line-height:1.6;"
               th:text="${product.description ?: 'No description provided.'}"></p>

            <div style="font-size:1.6rem; font-weight:700; color:#2563eb; margin-bottom:.5rem;"
                 th:text="'$' + ${product.price}"></div>

            <p style="font-size:.9rem; margin-bottom:.25rem;">
                <strong>Stock:</strong>
                <span th:text="${product.stock}"></span>
                <span th:if="${product.stock == 0}" style="color:#dc2626; font-weight:600;"> — Out of Stock</span>
            </p>
            <p style="font-size:.9rem; margin-bottom:1rem;">
                <strong>Seller:</strong>
                <span th:text="${product.seller.username}"></span>
            </p>
            <p style="font-size:.8rem; color:#94a3b8;"
               th:text="'Listed ' + ${#temporals.format(product.createdAt, 'dd MMM yyyy')}"></p>

            <!-- Edit/Delete — own SELLER or ADMIN only -->
            <div class="flex gap-2 mt-2"
                 th:with="isSeller=${#authorization.expression('hasRole(''SELLER'')') and product.seller.username == #authentication.name},
                           isAdmin=${#authorization.expression('hasRole(''ADMIN'')')}">
                <div th:if="${isSeller or isAdmin}" class="flex gap-2">
                    <a class="btn btn-sm btn-outline"
                       th:href="@{/products/{id}/edit(id=${product.id})}">✏️ Edit</a>
                    <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post"
                          onsubmit="return confirm('Delete this product?');">
                        <button class="btn btn-sm btn-danger" type="submit">🗑 Delete</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right: order panel — BUYER only -->
        <div>
            <div class="card" th:if="${#authorization.expression('hasRole(''BUYER'')')}">
                <h3 style="margin-bottom:1rem;">Place an Order</h3>
                <form th:action="@{/orders}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input class="form-control" type="number" id="quantity" name="quantity"
                               min="1" th:max="${product.stock}" value="1"
                               th:disabled="${product.stock == 0}" required/>
                    </div>
                    <button class="btn btn-primary" type="submit" style="width:100%;"
                            th:disabled="${product.stock == 0}"
                            th:text="${product.stock > 0 ? 'Buy Now' : 'Out of Stock'}">Buy Now</button>
                </form>
            </div>
            <div class="card" th:if="${#authorization.expression('!isAuthenticated()')}">
                <p class="text-muted" style="font-size:.9rem;">
                    <a th:href="@{/auth/login}" style="color:#2563eb;">Log in</a> to place an order.
                </p>
            </div>
        </div>
    </div>

    <hr style="margin:2rem 0; border:none; border-top:1px solid #e2e6ee;"/>

    <!-- Reviews section — visible to everyone -->
    <h3 style="margin-bottom:1rem;">
        Reviews
        <span class="text-muted" style="font-weight:400; font-size:.9rem;"
              th:text="'(' + ${reviews.size()} + ')'"></span>
    </h3>

    <p th:if="${reviews == null or #lists.isEmpty(reviews)}" class="text-muted">
        No reviews yet. Be the first!
    </p>

    <div th:each="review : ${reviews}"
         style="padding:1rem 0; border-bottom:1px solid #e2e6ee;">
        <div class="flex items-center justify-between" style="margin-bottom:.4rem;">
            <div>
                <strong th:text="${review.buyer.username}"></strong>
                <span style="margin-left:.5rem;">
                    <span th:each="i : ${#numbers.sequence(1,5)}"
                          th:text="${i <= review.rating ? '★' : '☆'}"
                          th:style="${i <= review.rating ? 'color:#f59e0b;' : 'color:#d1d5db;'}"></span>
                </span>
                <span class="text-muted" style="font-size:.8rem; margin-left:.5rem;"
                      th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}"></span>
            </div>
            <!-- Delete review — author or ADMIN only -->
            <form th:if="${#authorization.expression('hasRole(''ADMIN'')') or (#authorization.expression('isAuthenticated()') and review.buyer.username == #authentication.name)}"
                  th:action="@{/reviews/{id}/delete(id=${review.id})}" method="post"
                  onsubmit="return confirm('Delete this review?');">
                <input type="hidden" name="productId" th:value="${product.id}"/>
                <button class="btn btn-sm" type="submit"
                        style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:.85rem;">✕</button>
            </form>
        </div>
        <p style="color:#334155; line-height:1.5; margin:0;" th:text="${review.comment}"></p>
    </div>

    <!-- Leave a Review — BUYER only -->
    <div th:if="${#authorization.expression('hasRole(''BUYER'')')}" style="margin-top:1.5rem;">
        <div class="card">
            <h3 style="margin-bottom:1rem;">Leave a Review</h3>
            <form th:action="@{/products/{id}/reviews(id=${product.id})}"
                  th:object="${reviewDTO}" method="post">
                <div class="form-group">
                    <label for="rating">Rating (1–5)</label>
                    <input class="form-control" type="number" id="rating"
                           th:field="*{rating}" min="1" max="5" required
                           style="max-width:100px;"/>
                    <div class="form-error" th:errors="*{rating}"></div>
                </div>
                <div class="form-group">
                    <label for="comment">Comment</label>
                    <textarea class="form-control" id="comment" th:field="*{comment}"
                              rows="3" required placeholder="Share your experience..."></textarea>
                    <div class="form-error" th:errors="*{comment}"></div>
                </div>
                <button class="btn btn-primary" type="submit">Submit Review</button>
            </form>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline btn-sm" th:href="@{/products}">← Back to Products</a>
    </div>

    <style>
        @media (max-width: 680px) {
            .product-layout { grid-template-columns: 1fr !important; }
        }
    </style>
</section>
</body>
</html>
