<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Product Detail</title></head>
<body>

<div th:if="${successMessage}" style="color:green;" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" style="color:red;" th:text="${errorMessage}"></div>
<div th:if="${reviewError}" style="color:red;" th:text="${reviewError}"></div>

<h2 th:text="${product.name}"></h2>
<p th:text="${product.description}"></p>
<p>Price: <span th:text="${product.price}"></span></p>
<p>Stock: <span th:text="${product.stock}"></span></p>
<p>Category: <span th:text="${product.category != null ? product.category.name : 'N/A'}"></span></p>
<p>Seller: <span th:text="${product.seller.username}"></span></p>

<!-- Edit / Delete — only the product's own seller, or ADMIN -->
<div th:with="currentUser=${#authentication.name}">
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <a th:href="@{/products/{id}/edit(id=${product.id})}">Edit</a>
        <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display:inline;"
              onsubmit="return confirm('Delete this product?');">
            <button type="submit">Delete</button>
        </form>
    </div>
    <div th:if="${#authorization.expression('hasRole(''SELLER'')') and product.seller.username == #authentication.name}">
        <a th:href="@{/products/{id}/edit(id=${product.id})}">Edit</a>
        <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display:inline;"
              onsubmit="return confirm('Delete this product?');">
            <button type="submit">Delete</button>
        </form>
    </div>
</div>

<hr/>

<!-- Place Order — BUYER only -->
<div th:if="${#authorization.expression('hasRole(''BUYER'')')}">
    <h3>Place an Order</h3>
    <form th:action="@{/orders}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}"/>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1"
               th:max="${product.stock}" value="1" required/>
        <button type="submit" th:disabled="${product.stock == 0}">
            <span th:text="${product.stock > 0 ? 'Buy Now' : 'Out of Stock'}">Buy Now</span>
        </button>
    </form>
</div>

<hr/>

<!-- Reviews section — visible to everyone -->
<h3>Reviews</h3>

<p th:if="${reviews == null or #lists.isEmpty(reviews)}">No reviews yet.</p>

<div th:each="review : ${reviews}" style="border-bottom:1px solid #ccc; padding:6px 0;">
    <strong th:text="${review.buyer.username}"></strong>
    — <span th:text="${review.rating}"></span>/5
    <p th:text="${review.comment}"></p>
    <small th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}"></small>

    <!-- Delete review — only the review's author or ADMIN -->
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')') or (#authorization.expression('isAuthenticated()') and review.buyer.username == #authentication.name)}">
        <form th:action="@{/reviews/{id}/delete(id=${review.id})}" method="post"
              style="display:inline;"
              onsubmit="return confirm('Delete this review?');">
            <input type="hidden" name="productId" th:value="${product.id}"/>
            <button type="submit">Delete</button>
        </form>
    </div>
</div>

<!-- Leave a Review — BUYER only -->
<div th:if="${#authorization.expression('hasRole(''BUYER'')')}">
    <h4>Leave a Review</h4>
    <!--
        Bug fix: use th:object + th:field so Spring can bind and validate
        ReviewDTO correctly. Without th:object, @Valid sees an empty object
        and validation always fails.
    -->
    <form th:action="@{/products/{id}/reviews(id=${product.id})}"
          th:object="${reviewDTO}"
          method="post">
        <label for="rating">Rating (1–5):</label>
        <input type="number" id="rating" th:field="*{rating}" min="1" max="5" required/>
        <span th:errors="*{rating}" style="color:red;"></span>
        <br/>
        <label for="comment">Comment:</label><br/>
        <textarea id="comment" th:field="*{comment}" rows="3" cols="40" required></textarea>
        <span th:errors="*{comment}" style="color:red;"></span>
        <br/>
        <button type="submit">Submit Review</button>
    </form>
</div>

<br/>
<a th:href="@{/products}">Back to list</a>

<form th:action="@{/auth/logout}" method="post" style="margin-top:20px">
    <button type="submit">Logout</button>
</form>

</body>
</html>
