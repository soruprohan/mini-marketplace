<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>All Orders – Mini Marketplace</title>
</head>
<body>
<section>
    <div class="page-header">
        <h2>All Orders</h2>
        <span class="page-meta"
              th:text="${orders.size()} + ' total'"></span>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <div class="empty-icon">📋</div>
        <p class="text-muted">No orders in the system yet.</p>
    </div>

    <div class="table-wrapper" th:unless="${#lists.isEmpty(orders)}">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Buyer</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Status</th>
                    <th>Placed</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td class="text-muted text-sm" th:text="${order.id}"></td>
                    <td class="font-medium" th:text="${order.buyer.username}"></td>
                    <td>
                        <a class="link-plain"
                           th:href="@{/products/{id}(id=${order.product.id})}"
                           th:text="${order.product.name}"></a>
                    </td>
                    <td th:text="${order.quantity}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status == 'PENDING' ? 'badge-pending' : (order.status == 'RECEIVED' ? 'badge-confirmed' : 'badge-cancelled')}"
                              th:text="${order.status}"></span>
                    </td>
                    <td class="text-muted text-sm"
                        th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                    <td>
                        <form th:if="${order.status == 'PENDING'}"
                              th:action="@{/orders/{id}/cancel(id=${order.id})}"
                              method="post"
                              onsubmit="return confirm('Cancel order #' + /*[[${order.id}]]*/ + '?');">
                            <button class="btn btn-sm btn-danger" type="submit">Cancel</button>
                        </form>
                        <span th:unless="${order.status == 'PENDING'}" class="text-muted text-sm">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <a class="back-link" th:href="@{/admin/dashboard}">← Dashboard</a>
</section>
</body>
</html>
