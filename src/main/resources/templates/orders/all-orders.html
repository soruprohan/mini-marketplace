<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>All Orders – Mini Marketplace</title>
</head>
<body>
<section>
    <div class="flex items-center justify-between" style="margin-bottom:1.25rem;">
        <h2 style="margin:0;">All Orders</h2>
        <span class="text-muted" style="font-size:.88rem;"
              th:text="${orders.size()} + ' total'"></span>
    </div>

    <p th:if="${#lists.isEmpty(orders)}" class="text-muted">No orders in the system yet.</p>

    <div class="card" style="padding:0; overflow:hidden;" th:unless="${#lists.isEmpty(orders)}">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Buyer</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Status</th>
                    <th>Placed</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td class="text-muted" style="font-size:.85rem;" th:text="${order.id}"></td>
                    <td style="font-weight:500;" th:text="${order.buyer.username}"></td>
                    <td>
                        <a th:href="@{/products/{id}(id=${order.product.id})}"
                           th:text="${order.product.name}"
                           style="color:#2563eb; text-decoration:none;"></a>
                    </td>
                    <td th:text="${order.quantity}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status == 'PENDING' ? 'badge-pending' : (order.status == 'RECEIVED' ? 'badge-confirmed' : 'badge-cancelled')}"
                              th:text="${order.status}"></span>
                    </td>
                    <td class="text-muted" style="font-size:.85rem;"
                        th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                    <td>
                        <form th:if="${order.status == 'PENDING'}"
                              th:action="@{/orders/{id}/cancel(id=${order.id})}"
                              method="post"
                              onsubmit="return confirm('Cancel order #' + /*[[${order.id}]]*/ + '?');">
                            <button class="btn btn-sm btn-danger" type="submit">Cancel</button>
                        </form>
                        <span th:unless="${order.status == 'PENDING'}" class="text-muted" style="font-size:.82rem;">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline btn-sm" th:href="@{/admin/dashboard}">← Dashboard</a>
    </div>
</section>
</body>
</html>
