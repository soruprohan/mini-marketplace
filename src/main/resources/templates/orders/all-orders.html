<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>All Orders (Admin)</title></head>
<body>
<h2>All Orders</h2>

<div th:if="${successMessage}" style="color:green;" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" style="color:red;" th:text="${errorMessage}"></div>

<p th:if="${#lists.isEmpty(orders)}">No orders found.</p>

<table th:unless="${#lists.isEmpty(orders)}" border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Order ID</th>
        <th>Buyer</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Status</th>
        <th>Placed At</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.buyer.username}"></td>
        <td>
            <a th:href="@{/products/{id}(id=${order.product.id})}"
               th:text="${order.product.name}"></a>
        </td>
        <td th:text="${order.quantity}"></td>
        <td th:text="${order.status}"></td>
        <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        <td>
            <form th:if="${order.status == 'PENDING'}"
                  th:action="@{/orders/{id}/cancel(id=${order.id})}"
                  method="post"
                  onsubmit="return confirm('Cancel order #' + /*[[${order.id}]]*/ '?');">
                <button type="submit">Cancel</button>
            </form>
            <span th:unless="${order.status == 'PENDING'}" th:text="${order.status}"></span>
        </td>
    </tr>
    </tbody>
</table>

<br/>
<a th:href="@{/products}">Back to Products</a>

<form th:action="@{/auth/logout}" method="post" style="margin-top:20px">
    <button type="submit">Logout</button>
</form>
</body>
</html>
