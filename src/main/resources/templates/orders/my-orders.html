<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>My Orders – Mini Marketplace</title>
</head>
<body>
<section>
    <h2>My Orders</h2>

    <p th:if="${#lists.isEmpty(orders)}" class="text-muted">
        You have no orders yet. <a th:href="@{/products}" style="color:#2563eb;">Browse products →</a>
    </p>

    <div class="card" style="padding:0; overflow:hidden;" th:unless="${#lists.isEmpty(orders)}">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Status</th>
                    <th>Placed</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td class="text-muted" style="font-size:.85rem;" th:text="${order.id}"></td>
                    <td>
                        <a th:href="@{/products/{id}(id=${order.product.id})}"
                           th:text="${order.product.name}"
                           style="color:#2563eb; text-decoration:none; font-weight:500;"></a>
                    </td>
                    <td th:text="${order.quantity}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status == 'PENDING' ? 'badge-pending' : (order.status == 'RECEIVED' ? 'badge-confirmed' : 'badge-cancelled')}"
                              th:text="${order.status}"></span>
                    </td>
                    <td class="text-muted" style="font-size:.85rem;"
                        th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                    <td>
                        <div class="flex gap-2" th:if="${order.status == 'PENDING'}">
                            <form th:action="@{/orders/{id}/receive(id=${order.id})}" method="post"
                                  onsubmit="return confirm('Mark this order as received?');">
                                <button class="btn btn-sm btn-primary" type="submit">✓ Received</button>
                            </form>
                            <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post"
                                  onsubmit="return confirm('Cancel this order?');">
                                <button class="btn btn-sm btn-danger" type="submit">Cancel</button>
                            </form>
                        </div>
                        <span th:if="${order.status != 'PENDING'}" class="text-muted" style="font-size:.82rem;">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline btn-sm" th:href="@{/products}">← Back to Products</a>
    </div>
</section>
</body>
</html>
