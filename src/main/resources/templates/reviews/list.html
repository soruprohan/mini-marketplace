<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Reviews – Mini Marketplace</title>
</head>
<body>
<section>
    <h2>Reviews</h2>

    <p th:if="${#lists.isEmpty(reviews)}" class="text-muted">No reviews yet for this product.</p>

    <div th:each="review : ${reviews}"
         style="padding:1rem 0; border-bottom:1px solid #e2e6ee;">
        <div class="flex items-center justify-between" style="margin-bottom:.4rem;">
            <div>
                <strong th:text="${review.buyer.username}"></strong>
                <span style="margin-left:.5rem;">
                    <span th:each="i : ${#numbers.sequence(1,5)}"
                          th:text="${i <= review.rating ? '★' : '☆'}"
                          th:style="${i <= review.rating ? 'color:#f59e0b;' : 'color:#d1d5db;'}"></span>
                </span>
                <span class="text-muted" style="font-size:.8rem; margin-left:.5rem;"
                      th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}"></span>
            </div>
            <!-- Delete: owner or admin -->
            <div th:if="${#authorization.expression('hasRole(''ADMIN'')') or (#authorization.expression('isAuthenticated()') and review.buyer.username == #authentication.name)}">
                <form th:action="@{/reviews/{id}/delete(id=${review.id})}" method="post"
                      onsubmit="return confirm('Delete this review?');">
                    <input type="hidden" name="productId" th:value="${productId}"/>
                    <button class="btn btn-sm" type="submit"
                            style="background:none; border:none; cursor:pointer; color:#94a3b8;">✕ Delete</button>
                </form>
            </div>
        </div>
        <p style="color:#334155; line-height:1.5; margin:0;" th:text="${review.comment}"></p>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline btn-sm" th:href="@{/products/{id}(id=${productId})}">← Back to Product</a>
    </div>
</section>
</body>
</html>
