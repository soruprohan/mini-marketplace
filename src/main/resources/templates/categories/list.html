<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Categories – Mini Marketplace</title>
</head>
<body>
<section>
    <h2>Categories</h2>

    <p th:if="${#lists.isEmpty(categories)}" class="text-muted">No categories yet.</p>

    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; margin-bottom:2rem;"
         th:unless="${#lists.isEmpty(categories)}">
        <div class="card" th:each="cat : ${categories}" style="display:flex; flex-direction:column; gap:.5rem;">
            <div style="font-weight:600; font-size:1rem;" th:text="${cat.name}"></div>
            <div class="text-muted" style="font-size:.88rem; flex:1;"
                 th:text="${cat.description ?: 'No description.'}"></div>
            <div class="flex gap-2" style="margin-top:.5rem;">
                <a class="btn btn-sm btn-outline"
                   th:href="@{/products(categoryId=${cat.id})}">Browse</a>
                <!-- Delete — ADMIN only -->
                <form th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                      th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post"
                      onsubmit="return confirm('Delete this category?');">
                    <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Category form — ADMIN only -->
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <div class="card" style="max-width:440px;">
            <h3 style="margin-bottom:1rem;">Add Category</h3>
            <form th:action="@{/categories}" th:object="${categoryDTO}" method="post">
                <div class="form-group">
                    <label for="name">Name <span style="color:#dc2626;">*</span></label>
                    <input class="form-control" type="text" id="name" th:field="*{name}"
                           placeholder="e.g. Electronics"/>
                    <div class="form-error" th:errors="*{name}"></div>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input class="form-control" type="text" id="description" th:field="*{description}"
                           placeholder="Optional description"/>
                </div>
                <button class="btn btn-primary" type="submit">Add Category</button>
            </form>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline btn-sm" th:href="@{/products}">← Back to Products</a>
    </div>
</section>
</body>
</html>
