<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Categories – Mini Marketplace</title>
</head>
<body>
<section>
    <div class="page-header">
        <h2>Categories</h2>
    </div>

    <div th:if="${#lists.isEmpty(categories)}" class="empty-state mb-4">
        <div class="empty-icon">🗂️</div>
        <p class="text-muted">No categories yet.</p>
    </div>

    <div class="category-grid"
         th:unless="${#lists.isEmpty(categories)}">
        <div class="category-card" th:each="cat : ${categories}">
            <div class="category-name" th:text="${cat.name}"></div>
            <div class="category-desc"
                 th:text="${cat.description ?: 'No description.'}"></div>
            <div class="flex gap-2 mt-2">
                <a class="btn btn-sm btn-outline"
                   th:href="@{/products(categoryId=${cat.id})}">Browse</a>
                <!-- Edit — ADMIN only -->
                <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                   class="btn btn-sm btn-secondary"
                   th:href="@{/categories/{id}/edit(id=${cat.id})}">Edit</a>
                <!-- Delete — ADMIN only -->
                <form th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                      th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post"
                      onsubmit="return confirm('Delete this category?');"
                      style="display: inline;">
                    <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Category form — ADMIN only -->
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="mt-4">
        <div class="form-card">
            <div class="card">
                <h3>Add Category</h3>
                <form th:action="@{/categories}" th:object="${categoryDTO}" method="post">
                    <div class="form-group">
                        <label for="name">Name <span class="required-star">*</span></label>
                        <input class="form-control" type="text" id="name" th:field="*{name}"
                               placeholder="e.g. Electronics"/>
                        <div class="form-error" th:errors="*{name}"></div>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input class="form-control" type="text" id="description" th:field="*{description}"
                               placeholder="Optional description"/>
                    </div>
                    <button class="btn btn-primary" type="submit">Add Category</button>
                </form>
            </div>
        </div>
    </div>

    <a class="back-link" th:href="@{/products}">← Back to Products</a>
</section>
</body>
</html>
