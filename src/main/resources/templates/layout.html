<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">Mini Marketplace</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #f7f8fc;
            --surface:   #ffffff;
            --border:    #e2e6ee;
            --primary:   #2563eb;
            --primary-h: #1d4ed8;
            --danger:    #dc2626;
            --success:   #16a34a;
            --text:      #1e293b;
            --muted:     #64748b;
            --radius:    8px;
            --shadow:    0 1px 4px rgba(0,0,0,.08);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: var(--primary);
            color: #fff;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            height: 54px;
            box-shadow: 0 2px 6px rgba(37,99,235,.35);
        }
        nav .brand {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -.5px;
            color: #fff;
            text-decoration: none;
            margin-right: auto;
        }
        nav a {
            color: rgba(255,255,255,.88);
            text-decoration: none;
            font-size: .9rem;
            padding: 4px 10px;
            border-radius: 5px;
            transition: background .15s;
        }
        nav a:hover { background: rgba(255,255,255,.18); color: #fff; }
        nav .nav-sep { color: rgba(255,255,255,.3); }
        .logout-btn {
            background: rgba(255,255,255,.15);
            border: 1px solid rgba(255,255,255,.3);
            color: #fff;
            cursor: pointer;
            font-size: .9rem;
            padding: 4px 12px;
            border-radius: 5px;
            transition: background .15s;
        }
        .logout-btn:hover { background: rgba(255,255,255,.28); }

        main {
            max-width: 1080px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .alert {
            padding: .75rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            font-size: .9rem;
        }
        .alert-success { background: #dcfce7; color: #166534; border-left: 4px solid var(--success); }
        .alert-danger  { background: #fee2e2; color: #991b1b; border-left: 4px solid var(--danger); }
        .alert-info    { background: #dbeafe; color: #1e40af; border-left: 4px solid var(--primary); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        h1, h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--text); }
        h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: .75rem; }

        .btn {
            display: inline-block;
            padding: .45rem 1.1rem;
            border-radius: 6px;
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: opacity .15s, box-shadow .15s;
        }
        .btn:hover { opacity: .88; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
        .btn-primary  { background: var(--primary); color: #fff; }
        .btn-danger   { background: var(--danger);  color: #fff; }
        .btn-outline  { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-sm { padding: .3rem .75rem; font-size: .82rem; }

        table { width: 100%; border-collapse: collapse; background: var(--surface); }
        th, td { padding: .65rem .9rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: #f8fafc; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f1f5fd; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: .35rem; }
        .form-control {
            width: 100%;
            padding: .5rem .75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .95rem;
            background: #fff;
            color: var(--text);
            transition: border-color .15s;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        .form-error { color: var(--danger); font-size: .8rem; margin-top: .25rem; }

        .badge {
            display: inline-block;
            padding: .2rem .55rem;
            border-radius: 99px;
            font-size: .75rem;
            font-weight: 600;
        }
        .badge-pending   { background: #fef9c3; color: #854d0e; }
        .badge-confirmed { background: #dcfce7; color: #166534; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }

        footer {
            text-align: center;
            font-size: .8rem;
            color: var(--muted);
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .mt-1 { margin-top: .5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .text-muted { color: var(--muted); }
        .flex { display: flex; }
        .gap-2 { gap: .5rem; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
    </style>
</head>
<body>

<nav>
    <a class="brand" th:href="@{/products}">🛒 Mini Marketplace</a>

    <!-- Products and Categories: visible to everyone -->
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>

    <!-- SELLER only -->
    <a th:if="${#authorization.expression('hasRole(''SELLER'')')}"
       th:href="@{/products/new}">+ New Product</a>
    <a th:if="${#authorization.expression('hasRole(''SELLER'')')}"
       th:href="@{/products/my}">My Products</a>

    <!-- BUYER only -->
    <a th:if="${#authorization.expression('hasRole(''BUYER'')')}"
       th:href="@{/orders/my}">My Orders</a>

    <!-- ADMIN only -->
    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
       th:href="@{/orders/all}">All Orders</a>
    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
       th:href="@{/admin/dashboard}">Dashboard</a>

    <!-- Logged in -->
    <th:block th:if="${#authorization.expression('isAuthenticated()')}">
        <span class="nav-sep">|</span>
        <span th:text="'Hi, ' + ${#authentication.name}"
              style="color:rgba(255,255,255,.7); font-size:.85rem;"></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline;">
            <button class="logout-btn" type="submit">Logout</button>
        </form>
    </th:block>

    <!-- Not logged in -->
    <th:block th:if="${#authorization.expression('!isAuthenticated()')}">
        <a th:href="@{/auth/login}">Login</a>
        <a th:href="@{/auth/register}">Register</a>
    </th:block>
</nav>

<main>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>
    <div th:if="${infoMessage}"    class="alert alert-info"    th:text="${infoMessage}"></div>

    <div th:replace="${content}">Page content goes here.</div>
</main>

<footer>
    &copy; 2025 Mini Marketplace &mdash; CSE 3220
</footer>

</body>
</html>
